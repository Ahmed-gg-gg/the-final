name: Fix CyberShield desktop layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix academy layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('academy.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>CyberShield - مشروع تخرج الأمن السيبراني</title>', '<title>CyberShield - معسكر الأمن السيبراني</title>', 1)
          s = s.replace('#app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 80px; }', '#app { width: min(100%, 1200px); max-width: 1200px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 90px; }', 1)
          css = '''\n/* CyberShield responsive layout */\n@media (min-width: 769px) {\n  #app { width: min(100%, 1200px); max-width: 1200px; }\n  .header { padding: 16px 28px; border-radius: 0 0 18px 18px; }\n  .hero { padding: 34px 24px 30px; }\n  .hero h1 { font-size: 48px; }\n  .hero p { max-width: 760px; margin-left: auto; margin-right: auto; }\n  .stats-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }\n  .stat-card { padding: 24px 16px; }\n  .content-card { margin-left: 0; margin-right: 0; }\n  .detail-content { max-width: 1000px; margin: 0 auto; padding-left: 24px; padding-right: 24px; }\n  .detail-header { padding-left: 24px; padding-right: 24px; }\n  .bottom-nav { width: min(100%, 1200px); border-radius: 18px 18px 0 0; }\n  .nav-item { padding-left: 28px; padding-right: 28px; }\n}\n@media (min-width: 1024px) {\n  #page-home.active { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }\n  #page-home.active > .badge, #page-home.active > .hero, #page-home.active > .level-widget, #page-home.active > .stats-grid, #page-home.active > .section-title { grid-column: 1 / -1; }\n  #page-home .content-card { margin: 0; min-height: 190px; }\n}\n@media (max-width: 768px) { #app { width: 100%; max-width: 480px; } }\n'''
          if '/* CyberShield responsive layout */' not in s:
              s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit layout fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add academy.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix CyberShield desktop responsive layout"
          git push
name: Build CyberShield AI for Windows

on:
  push:
    branches:
      - feature/cybershield-core-cleanup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer and portable app
        run: npm run dist:win

      - name: Upload Windows EXE files
        uses: actions/upload-artifact@v4
        with:
          name: CyberShield-AI-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 7
